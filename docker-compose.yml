services:
  batuk:
    build:
      context: .
      dockerfile: Dockerfile
    image: batuk/sb-chat:enterprise
    restart: unless-stopped
    env_file:
      - ${BATUK_ENV_FILE:-.env.enterprise}
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      BATUK_ADVANCED_RAG_ENABLED: ${BATUK_ADVANCED_RAG_ENABLED:-false}
      BATUK_PYTHON_API_URL: ${BATUK_PYTHON_API_URL:-http://advanced-rag:8000}
      BATUK_PYTHON_INTERNAL_SECRET: ${BATUK_PYTHON_INTERNAL_SECRET:-change_me}
    ports:
      - "${BATUK_HTTP_PORT:-3000}:3000"
    volumes:
      - batuk_data:/app/data
      - batuk_branding:/app/public/branding
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mysql:
        condition: service_healthy
        required: false
      chroma:
        condition: service_started
        required: false
      ollama:
        condition: service_started
        required: false
      advanced-rag:
        condition: service_started
        required: false

  advanced-rag:
    build:
      context: ./optional-backend-for-advanced-rag
      dockerfile: Dockerfile
    image: batuk/advanced-rag-python:enterprise
    profiles: ["advanced-rag"]
    restart: unless-stopped
    environment:
      BATUK_PYTHON_INTERNAL_SECRET: ${BATUK_PYTHON_INTERNAL_SECRET:-change_me}
      BATUK_GLINER_MODEL: ${BATUK_GLINER_MODEL:-urchade/gliner_multi_pii-v1}
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      BATUK_GRAPH_RAG_LLM_ENDPOINT: ${BATUK_GRAPH_RAG_LLM_ENDPOINT:-}
      BATUK_GRAPH_RAG_LLM_API_KEY: ${BATUK_GRAPH_RAG_LLM_API_KEY:-}
      BATUK_GRAPH_RAG_LLM_MODEL: ${BATUK_GRAPH_RAG_LLM_MODEL:-}
    ports:
      - "${BATUK_ADVANCED_RAG_PORT:-8001}:8000"
    volumes:
      - batuk_data:/app/data
      - batuk_hf_models:/models/huggingface
    depends_on:
      neo4j:
        condition: service_healthy
        required: false

  neo4j:
    image: neo4j:5-community
    profiles: ["neo4j"]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change_me}
      NEO4J_dbms_security_procedures_unrestricted: gds.*,apoc.*
      NEO4J_dbms_security_procedures_allowlist: gds.*,apoc.*
    ports:
      - "${BATUK_NEO4J_HTTP_PORT:-7474}:7474"
      - "${BATUK_NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - batuk_neo4j_data:/data
      - batuk_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16-bookworm
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BATUK_DATA_POSTGRES_DATABASE:-batuk}
      POSTGRES_USER: ${BATUK_DATA_POSTGRES_USER:-batuk}
      POSTGRES_PASSWORD: ${BATUK_DATA_POSTGRES_PASSWORD:-batuk_password}
    ports:
      - "${BATUK_POSTGRES_PORT:-5432}:5432"
    volumes:
      - batuk_postgres:/var/lib/postgresql/data
      - ./database/postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BATUK_DATA_POSTGRES_USER:-batuk} -d ${BATUK_DATA_POSTGRES_DATABASE:-batuk}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${BATUK_DATA_MYSQL_DATABASE:-batuk}
      MYSQL_USER: ${BATUK_DATA_MYSQL_USER:-batuk}
      MYSQL_PASSWORD: ${BATUK_DATA_MYSQL_PASSWORD:-batuk_password}
      MYSQL_ROOT_PASSWORD: ${BATUK_DATA_MYSQL_ROOT_PASSWORD:-batuk_root_password}
    ports:
      - "${BATUK_MYSQL_PORT:-3306}:3306"
    volumes:
      - batuk_mysql:/var/lib/mysql
      - ./database/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${BATUK_DATA_MYSQL_USER:-batuk} -p${BATUK_DATA_MYSQL_PASSWORD:-batuk_password} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  chroma:
    image: chromadb/chroma:latest
    profiles: ["chroma"]
    restart: unless-stopped
    ports:
      - "${BATUK_CHROMA_PORT:-8000}:8000"
    volumes:
      - batuk_chroma:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "${BATUK_OLLAMA_PORT:-11434}:11434"
    volumes:
      - batuk_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-gemma3:1b}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "ollama pull \"$${OLLAMA_DEFAULT_MODEL}\""]

volumes:
  batuk_data:
  batuk_branding:
  batuk_postgres:
  batuk_mysql:
  batuk_chroma:
  batuk_ollama:
  batuk_hf_models:
  batuk_neo4j_data:
  batuk_neo4j_logs:
